<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">A dark toolkit panel with orbiting technology nodes and labeled chips.</desc>
  <defs>
    <linearGradient id="borderGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e3f66"/>
      <stop offset="50%" stop-color="#1a2b44"/>
      <stop offset="100%" stop-color="#d23648" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#2a85ff"/>
      <stop offset="100%" stop-color="#1d5fe3"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4d63"/>
      <stop offset="100%" stop-color="#d12a44"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#374d6d" opacity="0.45"/>
    </pattern>
    <style><![CDATA[
      text { font-family: Inter, "Segoe UI", sans-serif; fill: #edf4ff; }
      .eyebrow { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; fill: #a9b9d6; font-weight: 700; }
      .title { font-size: 38px; font-weight: 800; fill: #edf4ff; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.02em; fill: #edf4ff; }
      .chipText { font-size: 13px; font-weight: 600; fill: #edf4ff; }
      .coreText { font-size: 19px; font-weight: 800; letter-spacing: 0.02em; fill: #edf4ff; }
      .nodeText { font-size: 11px; font-weight: 700; fill: #edf4ff; }
    ]]></style>
  </defs>

  <rect x="2" y="2" width="996" height="456" rx="24" fill="#071827"/>
  <rect x="2" y="2" width="996" height="456" rx="24" fill="url(#dots)" opacity="0.22"/>
  <rect x="2" y="2" width="996" height="456" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <g>
    <text class="eyebrow" x="44" y="52">02 / TOOLKIT</text>
    <text class="title" x="44" y="108">Tools I build with</text>

    <text class="eyebrow" x="44" y="170">LANGUAGES</text>
    <g transform="translate(44 185)">
      <rect width="96" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="48" y="21" text-anchor="middle">C</text>
      <rect x="108" width="96" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="156" y="21" text-anchor="middle">Java</text>
      <rect x="216" width="98" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="265" y="21" text-anchor="middle">Python</text>
    </g>

    <g transform="translate(44 235)">
      <rect width="110" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="55" y="21" text-anchor="middle">TypeScript</text>
      <rect x="122" width="90" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="167" y="21" text-anchor="middle">AI</text>
      <rect x="224" width="104" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="276" y="21" text-anchor="middle">Data</text>
      <rect x="340" width="100" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="390" y="21" text-anchor="middle">Infra</text>
    </g>

    <g transform="translate(44 285)">
      <rect width="94" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="47" y="21" text-anchor="middle">YOLO</text>
      <rect x="106" width="120" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="166" y="21" text-anchor="middle">PostgreSQL</text>
      <rect x="238" width="92" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="284" y="21" text-anchor="middle">Docker</text>
      <rect x="342" width="86" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="385" y="21" text-anchor="middle">Groq</text>
    </g>

    <text class="eyebrow" x="44" y="354">WEB</text>
    <g transform="translate(44 370)">
      <rect width="96" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="48" y="21" text-anchor="middle">React</text>
      <rect x="108" width="96" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="156" y="21" text-anchor="middle">Next.js</text>
      <rect x="216" width="100" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="266" y="21" text-anchor="middle">Tailwind</text>
      <rect x="328" width="96" height="32" rx="16" fill="#0d1d31" stroke="#2a426d"/>
      <text class="chipText" x="376" y="21" text-anchor="middle">Node.js</text>
    </g>
  </g>

  <g transform="translate(560 230)">
    <ellipse cx="0" cy="0" rx="245" ry="72" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.9" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="212" ry="62" fill="none" stroke="url(#redGrad)" stroke-width="2" opacity="0.9" transform="rotate(24)"/>
    <ellipse cx="0" cy="0" rx="164" ry="44" fill="none" stroke="#6f8fc6" stroke-width="1.8" opacity="0.7" transform="rotate(-44)"/>

    <circle r="68" fill="#0d1d31" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" class="coreText">BUILD</text>
    <text x="0" y="22" text-anchor="middle" class="coreText">STACK</text>

    <g transform="translate(-212 -68)">
      <circle r="28" fill="#0d1d31" stroke="#2a85ff" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" class="nodeText">AI</text>
    </g>

    <g transform="translate(198 70)">
      <circle r="28" fill="#0d1d31" stroke="#ff4d63" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" class="nodeText">Py</text>
    </g>

    <g transform="translate(-118 90)">
      <circle r="28" fill="#0d1d31" stroke="#2a85ff" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" class="nodeText">JS</text>
    </g>

    <g transform="translate(150 -28)">
      <circle r="28" fill="#0d1d31" stroke="#ff4d63" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" class="nodeText">DB</text>
    </g>

    <g transform="translate(0 -140)">
      <circle r="28" fill="#0d1d31" stroke="#2a85ff" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" class="nodeText">C</text>
    </g>
  </g>
</svg>
